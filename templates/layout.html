<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クイズRPG道場</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe src="{{ target_url }}" id="game-frame"></iframe>

    <script>
        // 1. 音源の準備
        const bgms = {
            menu: new Audio('/static/sounds/bgm_menu.mp3'),
            battle: new Audio('/static/sounds/bgm_battle.mp3'),
            study: new Audio('/static/sounds/bgm_study.mp3')
        };

        // 基本設定
        Object.values(bgms).forEach(a => { 
            a.loop = true; 
            a.volume = 0.4; 
            a.preload = "auto";
        });

        let currentBgm = null;

        /**
         * BGMを切り替える（iframeから呼ばれる）
         */
        function changeBGM(type) {
            console.log("Request BGM:", type);
            const nextBgm = bgms[type];
            if (!nextBgm || currentBgm === nextBgm) return;

            // 今の曲を止める
            if (currentBgm) {
                currentBgm.pause();
                currentBgm.currentTime = 0;
            }

            currentBgm = nextBgm;
            
            // 再生を試みる（スマホではここで失敗するが、それでOK）
            currentBgm.play().catch(e => {
                console.log("Play blocked. Waiting for touch.");
            });
        }

        /**
         * スマホ・PC共通：ユーザーが画面を触った瞬間に音を叩き起こす
         */
        const unlockAudio = () => {
            // 現在セットされている曲があれば再生
            if (currentBgm) {
                const playPromise = currentBgm.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log("Unlock failed:", e));
                }
            }

            // 【重要】SEが鳴るタイミングで「他の全ての曲」も1回ずつplayを叩いて
            // ブラウザの「自動再生禁止」のフラグを折る
            Object.values(bgms).forEach(audio => {
                // まだロード中の場合などは無視して次に進む（エラーで止まらせない）
                if (audio.readyState >= 2) { // 2 = HAVE_CURRENT_DATA 以上ならOK
                    const p = audio.play();
                    if (p !== undefined) {
                        p.then(() => {
                            if (audio !== currentBgm) {
                                audio.pause();
                            }
                        }).catch(e => {});
                    }
                }
            });
        };

        // clickとtouchstartの両方に登録（removeしないことで、曲が変わるたびに解除し直す）
        window.addEventListener('click', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);
    </script>
</body>
</html>
